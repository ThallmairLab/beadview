[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beadview"
dynamic = ["version"]
description = "Drawing, structure generation and ITP editing for CGSmiles coarse-grained mappings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Thilo Duve", email = "duve@fias.uni-frankfurt.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "cgsmiles>=1.0",
    "pysmiles>=2.0",
    "rdkit",
    "numpy",
    "networkx>=2.0",
    "contourpy",
]

[project.urls]
Homepage = "https://github.com/ThallmairLab/beadview"
Source = "https://github.com/ThallmairLab/beadview"
Issues = "https://github.com/ThallmairLab/beadview/issues"

[project.optional-dependencies]
# CGMapping.show() and show_default()
show = ["matplotlib", "pillow", "resvg-py>=0.5,<0.6", "scipy"]
# aa_structure() and cg_structure()
structure = ["MDAnalysis"]
# read_itp(), change_itp() and write_itp()
itp = ["vermouth"]
all = ["beadview[show,structure,itp]"]
dev = ["beadview[all]", "pytest", "ipython"]

[tool.setuptools.dynamic]
version = { attr = "beadview.__version__" }

[tool.setuptools.packages.find]
include = ["beadview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
